<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a2b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>KAIRO — Modern Home &amp; Living</title>
  </head>
  <body>
    <div id="root">
      <!-- Static splash: replaced when React mounts. Improves perceived load. -->
      <div
        style="display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:#faf7f0"
      >
        <div
          style="display:flex;height:3.5rem;width:3.5rem;align-items:center;justify-content:center;border-radius:1rem;background:#1e3a2b;color:#cdeb4b"
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M11 20A7 7 0 0 1 4 13c0-6 5-9 16-9 0 8-4 13-9 13Zm0 0 4-4" />
          </svg>
        </div>
        <div
          style="height:2rem;width:2rem;border-radius:9999px;border:2px solid #e2d9c6;border-top-color:#1e3a2b;animation:kairo-spin 0.8s linear infinite"
        />
        <p style="font-family:Georgia, serif;font-size:1.5rem;color:#17150e">KAIRO</p>
        <style>@keyframes kairo-spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
